# cargo-mutants configuration.
#
# a mutant that survives in one of these files means the test suite has a blind spot

examine_globs = [
    "src/emsm/emsm.rs",          # encryption/decryption
    "src/emsm/malicious.rs",     # consistency check
    "src/emsm/dual_lpn.rs",      # masking
    "src/emsm/raa_code.rs",      # RAA code arithmetic
    "src/emsm/pedersen.rs",      # MSM wrapper + length checks
    "src/groth16/server_aided.rs", # proof pipeline
    "src/protocol/session.rs", # secure access, resource ownership
]

# Low value and noisy targets. Mutation generator may find dozens of candidates
# on some of these files so it will take a long of time. I decided to prioritize cryptography/security targets
# Still this is not an excuse to not perform mutation testing on these files.
# Run separately with `cargo mutants --no-config --file src/protocol/server.rs`  
exclude_globs = [
    "src/bin/**",
    "src/protocol/client.rs",
    "src/protocol/config.rs",
    "src/protocol/error.rs",
    "src/protocol/messages.rs",
    "src/protocol/metrics.rs",
    "src/protocol/server.rs",
    "src/groth16/circom.rs",
    "src/emsm/params.rs",
]

# Groth16 setup makes each test run a few seconds
# give mutants headroom so a slow-but-correct run isn't misreported as caught by timeout.
timeout_multiplier = 3.0
minimum_test_timeout = 180

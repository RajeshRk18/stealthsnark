[package]
name = "stealthsnark"
version = "0.1.0"
edition = "2021"

[lints.rust]
# `kani` is set by the cargo-kani driver, not cargo. Declaring it here
# keeps `#[cfg(kani)]` proof modules from tripping the unexpected-cfg lint on a
# normal build. 
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"
required-features = ["circom"]


[[bin]]
name = "keygen"
path = "src/bin/keygen.rs"

[features]

default = ["circom", "tls"]
circom = ["dep:ark-circom", "dep:num-bigint"]

tls = [
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pki-types",
    "dep:hyper",
    "dep:hyper-util",
    "dep:tower",
]

[dependencies]
# Arkworks
ark-ff = { version = "0.5", features = ["std"] }
ark-ec = { version = "0.5", features = ["std"] }
ark-poly = { version = "0.5" }
ark-std = { version = "0.5" }
ark-serialize = { version = "0.5", features = ["derive"] }
ark-bn254 = { version = "0.5" }
ark-groth16 = { version = "0.5" }
ark-relations = { version = "0.5" }
ark-snark = { version = "0.5" }
ark-r1cs-std = { version = "0.5" }
ark-crypto-primitives = { version = "0.5" }

# Networking
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "http2",
    "charset",
    "rustls-tls",
] }
tower-http = { version = "0.6", features = ["trace", "request-id", "catch-panic"] }


rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "logging",
], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
], optional = true }
rustls-pki-types = { version = "1", optional = true }

hyper = { version = "1", features = ["http1", "http2", "server"], optional = true }
hyper-util = { version = "0.1", features = [
    "server",
    "server-auto",
    "server-graceful",
    "tokio",
], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }


sha2 = "0.10"
subtle = "2.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }

# Circom 
ark-circom = { version = "0.5", default-features = true, optional = true }
num-bigint = { version = "0.4", optional = true }

# Other
rayon = "1.10"
rand = "0.8"
rand_chacha = "0.3"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
rcgen = "0.13"

[[bench]]
name = "msm_scaling"
harness = false


[[bench]]
name = "throughput"
harness = false


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only" # keeps panic backtraces useful in production
